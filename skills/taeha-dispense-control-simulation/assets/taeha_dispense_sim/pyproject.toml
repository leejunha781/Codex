[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taeha-dispense-sim"
version = "0.1.0"
description = "Reference simulation for bounded STM32 material-dispensing control"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.9"]

[project.scripts]
taeha-dispense-sim = "taeha_dispense_sim.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
