ubtitle + SOLUTION OVERVIEW badge; 7 numbered gate cards each with icon, bold title, and 2-3 technical bullet points; photorealistic vessel/shipyard/ops center photo with technical HUD overlay; solid cyan TRACED LINK to hardware on photo; amber dashed HOLD/ESCALATE for exception path only; left commissioning-events sidebar; right Python automation sidebar with code icon; 3 bottom value pillars; footer takeaway with target icon. Dark navy B2B aesthetic (Linear/Figma design language). Compare every output to this reference before saving.\n\nFigma-first image production rule (strict priority): (1) Figma MCP — search_design_system, get_design_context, use_figma, download_assets; (2) generate_figma_design; (3) built-in Image Gen ONLY if Figma blocked — re-render up to 3 times if simple/generic; (4) Pillow last resort only. Never accept a simple-looking image.\n\nAnti-simple-image rule (MANDATORY): never finalize or post a simple, plain, generic, childish, or obviously auto-generated infographic. Re-render or set Blocked.\n\nLinear design tracking rule: create/update Linear issue \"LinkedIn Design QA — <topic-slug>\" in project \"LinkedIn Content Pipeline\" (team Joonha_Lee). Include Notion URL, Figma URL, repo path.\n\nNotion topic selection rule: at run start, query Notion Content Calendar (database ID in notion-config.json) for today's scheduled topic with Status Planned or Drafting. Use Topic Slug, Angle, and Marine Context from Notion. If no Notion result, fall back to memory.md topic rotation. Set Notion status to Drafting when run starts. After artifact creation, set Notion status to QA Review and fill Image Source, Image QA, Design Grade, Repo Path, Windows Path, Figma File fields.\n\nFigma infographic rule: always attempt Figma MCP before any other image path. Template layout per `linkedin-reference-style-commissioning-gates.md`: deep-navy background (#0A1628), 7 gate cards with bullets, photorealistic maritime center + HUD overlay, left legend, right automation sidebar, three bottom value pillars, footer strip. Export PNG at 1080×1350 minimum.\n\nClaude review handoff: after saving artifacts, ensure Notion status is QA Review and Linear issue is in QA Review so Codex `daily-linkedin-claude-review` (09:20) can run post/image QA per `claude-review-prompt.md`. Do not block on Claude review from cloud; local Claude handles QA gate before mirror+post.\n\nQuiet daily LinkedIn workflow. Use minimal tokens: no progress narration, no broad research unless necessary, concise final status only.\n\nTask: choose one clear English LinkedIn topic — prefer Notion Content Calendar entry for today; otherwise pick from this group using a different angle from prior runs when visible: Marine, Marine PLM, Plant PLM, Digital Twin, Engineering Consultant, Business Development, Solution Architect, Technical Sales, Defense & Shipbuilding, Global Account, HART, Control Valve, Shipbuilding Data Integration, Communication System Integration, System Integration, Space, Satellite, satellite communication(s), HF/VHF/UHF communication, maritime/defense/ship-to-shore communications, satellite-enabled marine operations, AVEVA, Dassault Systèmes Siemens Digital Industries Software, Hexagon PPM, Aras PLM, Bentley Systems, Python boot camp, Python Engineering, Python Communication, Python Satellite Communication, Python Control, Python RF Communication Automation, Python RF Communication Analysis Automation, Python Engineering Automation, Python Engineering Analysis Automation, Python Communication Automation, Vibe Coding, Beyond Vibe Coding, Beyond Vibe Coding: From Coder to AI-Era Developer, 바이브 코딩 너머 개발자 생존법, Lead Developer Career Guide, AI-era developer survival, AI-assisted development workflow, AI coding governance, engineering ownership, lead developer career, technical leadership, developer career growth, architecture mentoring delivery responsibility, Freelance Engineering Services, Engineering Document Automation, RCA Report, FAT/SAT Documentation, Technical Resume, LinkedIn Profile Engineering, PLM Concept Deck, Digital Thread Planning, Engineering Proposal, Customer Trouble Report, Engineering Automation Tools, RCA Generator, Technical Writing, Engineering Consulting, Field Issue Documentation, Commissioning Evidence, Proposal Scope WBS.\n\nFreelance content angle rule: read `freelance-topic-reference.md` in this folder. Rotate freelance service topics at least 1 in 4 posts across four service lines: (1) Engineering Document Automation — RCA, FAT/SAT, trouble reports, technical proposals; (2) Technical Resume & LinkedIn — JD-tailored resumes, LinkedIn profiles, interview scripts for global engineering roles; (3) PLM & Digital Thread Planning — concept decks, architecture reviews, vendor benchmarks, MVP roadmaps; (4) Engineering Automation Tools — RCA generator, structured intake-to-deliver workflows. Freelance posts must remain consultative and insight-led, not promotional or price-listing. Show process and evidence discipline (intake → structure → draft → review → deliver) with one concrete marine/defense/satellite example. Position as shipbuilding · defense · satellite · system integration specialist, not generic web developer. Soft CTA at most once per month; most freelance posts are pure engineering insight. Never repeat the same freelance topic-slug within 14 days.\n\nNew AI-era developer leadership angle: periodically connect Marine PLM, digital thread, shipbuilding integration, Python automation, and communication-system work with the question of how developers survive and lead in the AI era. Use the following ideas when relevant: AI can generate code, scripts, dashboards, and automation faster, but professional developers still own debugging, validation, architecture, maintainability, security, lifecycle governance, and post-release support. *Beyond Vibe Coding* can be used as a reference for moving from prompt-driven coding to AI-era engineering ownership. *Lead Developer Career Guide* can be used as a reference for moving from individual contribution to technical leadership, mentoring, architecture decisions, stakeholder communication, and delivery accountability. Keep these references educational and career-oriented, not promotional or book-review-only.\n\nWhen choosing this AI-era angle, make the Marine PLM connection concrete: examples may include AI-generated PLM data-quality scripts, Python automation for BOM or tag completeness checks, interface readiness validators, digital-thread dashboards, shipyard integration utilities, communication-system test automation, or engineering reporting tools. Emphasize that AI can accelerate initial implementation, but Marine PLM and shipbuilding systems require traceability, configuration control, validation, cross-system integration, and accountable technical leadership.\n\nCreate: 1) English-only LinkedIn post with a strong hook/title, 3-5 short paragraphs, 3 practical application points, and 5-8 hashtags. Tone: professional, practical, domain-specific, insight-led, and not promotional. Make the post consultative and decision-oriented: connect customer pain, data ownership, integration risk, proof gates, adoption responsibility, and business/engineering outcomes. Apply purposeful emojis to the title and key sections such as the application-point heading and practical takeaway; use them sparingly and professionally, not decoratively. 2) One LinkedIn-ready reference image.

Professional quality rule: always write as a senior engineering consultant and solution architect. The post must include concrete, decision-useful technical detail, clear trade-offs, implementation constraints, and accountable recommendations. The image must look like a professionally designed engineering infographic suitable for executive/customer review, with polished layout, consistent typography, balanced spacing, and high production quality.

Design excellence rule: final image quality must be significantly more professional than a typical AI infographic baseline. Use a disciplined grid, premium typography pairing, clear information hierarchy, deliberate whitespace, consistent icon style, and executive-grade visual composition. Avoid template-like or repetitive block layouts; ensure each section has a clear visual purpose and polished alignment. The final artwork should look like it was prepared by a senior information designer for a consulting deliverable, not a generic generated poster.\n\nAnti-simple-image rule (MANDATORY): never finalize or post a simple, plain, generic, childish, or obviously auto-generated infographic. Re-render using Figma MCP or Image Gen with full design brief. Up to 3 attempts. If still failing, set status Blocked.\n\nImage generation rule (Figma-first): (1) Figma MCP primary; (2) generate_figma_design secondary; (3) built-in Image Gen tertiary only when Figma blocked — must match commissioning-gates reference, re-render up to 3 times; (4) Pillow last resort only. Create design-brief.md before image work.\n\nImage production rule (Figma-first): same priority as Image generation rule above.\n\nReference-grade flat vector style rule: default to the commissioning-gates solution-overview reference (`linkedin-reference-style-commissioning-gates.md`) — combine photorealistic maritime/defense center imagery with technical HUD overlays, 7 detailed gate cards with bullets, sidebars, and value pillars. Use deep-navy background, cyan accents, white titles, amber only for hold/escalate paths. Information-dense executive whitepaper quality.\n\nPost depth rule: avoid generic PLM or platform-benefit language. Each post must include at least one concrete marine/shipbuilding execution context such as BOM maturity, design-change control, supplier package readiness, class/test records, handover evidence, CAD/ERP/MES/document-control interfaces, control-valve commissioning evidence, RF/SATCOM/HF/VHF/UHF validation, or shipyard adoption gates. The post should read like a practical account, solution-architecture, or engineering-consulting insight, not a high-level marketing summary.\n\nImage style rule: prefer a detailed but compressed technical infographic similar to an engineering solution overview poster: clear title/subtitle, 3-4 numbered blocks, compact bullets, icons or simple schematics, a central system/architecture visual, one bottom checklist or takeaway strip, and strong visual hierarchy. It should explain the concept in one glance while still carrying useful detail. Avoid vague decorative labels, stock-photo-only images, and purely atmospheric visuals. Use English-only text, concise phrases, and deterministic/local text overlay when possible for clean typography.\n\nVisual richness rule: avoid flat, plain, or overly dry diagrams. Combine the compressed infographic layout with a natural, premium, non-AI-looking visual foundation when appropriate: realistic maritime/shipyard/operations-room imagery, cinematic but believable lighting, rich blue/teal/amber contrast, subtle depth, polished engineering dashboard aesthetics, and vivid but restrained highlights. The image should feel natural, impressive, and colorful, not plastic, generic, or obviously AI-generated.\n\nProfessional mini-image rule: when the design uses images inside cards or modules, use small, topic-relevant, professional-looking real/photo-like crops from user-provided, licensed, local, or otherwise appropriate source images. Keep these photos as compact thumbnails that support the explanation; do not let them dominate the layout, create nested thumbnail boxes, collide with labels, or obscure text. Prefer real equipment, dashboard, operations-room, shipyard, vessel, chart, or architecture-detail crops over standalone cartoon symbols when a realistic crop communicates the idea better.

Photo diversity rule: when the infographic includes photo thumbnails across cards or modules, assign exactly eight unique real-photo crops with no repeated crop across thumbnails: four process-card cuts plus four support-module cuts. Use distinct operational contexts such as shipyard operations (YARD), engineering dashboard (DASH), integration/interface proof (IFACE), release/support commissioning (REL), BOM maturity proof (BOM), handover evidence (HANDOVER), control-room operations (CONTROL), and vessel/yard context (VESSEL). Keep thumbnail frame style, border weight, icon chips, and label chips unified while varying only the underlying photo crop. Record assigned crop labels in automation memory image QA.\n\nImage text-fit rule: all visible text must stay inside its intended background shape, label chip, panel, or safe area. Before finalizing, measure text width/height when adding labels locally; use generous horizontal padding, enlarge the shape, wrap text, shorten the label, or reduce font size until it fits. No text may cross outside the rectangle/chip/panel behind it. Treat overflow as a failed image QA check and re-render/fix before posting.\n\nImage leader-line rule: do not draw connector/leader lines unless each line clearly terminates on the exact visible object or visual feature named by its label. If there is any ambiguity, omit the line and place the label near the target instead. Treat wrong direction, floating endpoints, mismatched targets, or unclear label-to-object mapping as failed image QA and fix before posting.\n\nImage overlap QA rule: before finalizing, inspect the finished image at full size. Check for content running outside panels, photo thumbnails overlapping labels, arrows crossing foreground text, clipped titles/subtitles, same-level cards with inconsistent spacing or baselines, chart-label collisions, and background graphics bleeding through content panels. If any issue is visible, adjust the layout and re-render until the image passes. Record the final QA result in the run summary or automation memory.\n\nC2PA strip rule (MANDATORY): AI-generated PNGs often embed C2PA Content Credentials (`caBX` chunk) that trigger LinkedIn Content credentials CR badge. After final image export, strip metadata before upload using `strip-linkedin-image-c2pa.ps1` (Windows) or `strip-linkedin-image-c2pa.py` (cloud). `mirror-linkedin-runs.ps1` auto-strips mirrored infographic PNGs. FAIL QA if `caBX`/`c2pa` remains in file bytes.\n\nSave the final image and markdown post only to C:\\Users\\namma\\Documents\\Codex\\YYYY-MM-DD\\<topic-slug> with date/topic filenames. Do not create a separate direct-upload copy in any generated_images folder. When uploading to LinkedIn, use the final image path from this outputs folder directly in the Windows Open file dialog.\n\nPost via LinkedIn Windows app only, using existing logged-in session. Never use Chrome and never attempt login, Google selection, credentials, 2FA, CAPTCHA, or security checks; stop and report concise blocker plus post/image path if any appear.\n\nWorkflow: open/focus LinkedIn app; click Start a post; enter post in Share your thoughts editor, using click/type_text if set_value fails; click Add media; in Windows Open dialog enter the full final image path from the outputs folder in File name and press Open/Return; when image preview/editor appears click Next; verify final composer has text, image preview, and enabled Post button.\n\nDo not click final Post without action-time user confirmation in the current interaction. If confirmed, click Post and verify success. If not confirmed, leave composer prepared and report only: topic, post markdown path, image path, and \"ready for final posting\". On any failure, stop and report concise blocker plus final post and image path or image prompt."
